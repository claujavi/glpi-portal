{% extends "base.html" %}
{% block title %}Mis pedidos — Portal{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Mis pedidos</h1>
</div>

<div class="search-bar">
  <input type="search"
         name="q"
         placeholder="Buscar por título o #ID..."
         value="{{ q or '' }}"
         autocomplete="off"
         hx-get="/tickets"
         hx-trigger="keyup changed delay:300ms, search"
         hx-target="#tickets-container"
         hx-swap="innerHTML">
</div>

<div id="tickets-container">
  {% include "partials/ticket_list.html" %}
</div>
{% endblock %}
